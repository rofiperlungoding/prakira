<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-label="Prakira architecture: data, rules, model, verifier, briefing" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#101a13">
  <rect width="980" height="520" fill="#fbfbf6"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#101a13"/></marker></defs>
  <text x="30" y="40" font-size="22" font-weight="600">How a Prakira briefing is made</text>
  <text x="30" y="64" fill="#434d46">Only the lilac box is a language model. Everything else is fixed code that can be unit-tested.</text>

  <!-- Row 1: sources -->
  <g>
    <rect x="30" y="92" width="200" height="74" rx="10" fill="#fff" stroke="#e2e5da" stroke-width="1.5"/>
    <text x="46" y="120" font-weight="600">Open-Meteo forecast</text><text x="46" y="142" fill="#434d46">heat, humidity, rain, UV</text>
    <rect x="250" y="92" width="200" height="74" rx="10" fill="#fff" stroke="#e2e5da" stroke-width="1.5"/>
    <text x="266" y="120" font-weight="600">CAMS air quality</text><text x="266" y="142" fill="#434d46">US AQI and PM2.5</text>
    <rect x="470" y="92" width="200" height="74" rx="10" fill="#fff" stroke="#e2e5da" stroke-width="1.5"/>
    <text x="486" y="120" font-weight="600">ERA5-based archive</text><text x="486" y="142" fill="#434d46">daily highs, 1991 to 2020</text>
    <rect x="750" y="92" width="200" height="74" rx="10" fill="#fff" stroke="#e2e5da" stroke-width="1.5"/>
    <text x="766" y="120" font-weight="600">Household</text><text x="766" y="142" fill="#434d46">place, people, language</text>
  </g>
  <g stroke="#101a13" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M130 166v40"/><path d="M350 166v40"/><path d="M570 166v40"/><path d="M850 166v40"/>
  </g>

  <!-- Row 2: rules -->
  <rect x="30" y="208" width="920" height="84" rx="10" fill="#e3f3d4"/>
  <text x="46" y="236" font-weight="600">Rules (lib/facts.mjs, lib/climate.mjs)</text>
  <text x="46" y="258" fill="#2f3d33">NWS heat index and categories · EPA AQI categories · WHO UV tiers · rain classes · difference from the 30-year normal</text>
  <text x="46" y="279" fill="#2f3d33">The household sets which levels count as serious. Output: a fact table with ids, values and levels.</text>
  <text x="934" y="236" text-anchor="end" font-size="13" font-weight="600">deterministic</text>

  <g stroke="#101a13" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M240 292v36"/><path d="M700 292v126"/></g>
  <text x="712" y="352" font-size="13" fill="#434d46">fact table</text>
  <text x="252" y="316" font-size="13" fill="#434d46">serious facts only; none: no model call</text>

  <!-- Row 3: model -->
  <rect x="30" y="330" width="420" height="74" rx="10" fill="#dcaaf6"/>
  <text x="46" y="358" font-weight="600">Language model (lib/llm.mjs)</text>
  <text x="46" y="380">writes one action per serious hazard, and no numbers</text>
  <text x="434" y="358" text-anchor="end" font-size="13" font-weight="600">not trusted</text>
  <g stroke="#101a13" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M240 404v14"/></g>

  <!-- Row 4: verifier -->
  <rect x="30" y="420" width="920" height="74" rx="10" fill="#b7f07c"/>
  <text x="46" y="448" font-weight="600">Screen, evidence and notices (lib/verify.mjs, lib/notice.mjs)</text>
  <text x="46" y="470">removes actions that over-warn or contain a number; builds each evidence sentence from the fact table; fills gaps with notices</text>
  <text x="934" y="448" text-anchor="end" font-size="13" font-weight="600">deterministic</text>
  <text x="490" y="512" text-anchor="middle" font-size="13" fill="#434d46">Result: 72-hour strip, climate row, actions with data-built evidence, standard notices, and the list of removed actions.</text>
</svg>
