<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prakira: climate briefings with receipts</title>
<meta name="description" content="What the next 72 hours mean for your household. The AI writes the actions; every number comes straight from the forecast.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2064%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23fff3d6%22%2F%3E%3Cpath%20d%3D%22M18%2034a14%2014%200%200128%200z%22%20fill%3D%22%23f4a04c%22%20stroke%3D%22%23101a13%22%20stroke-width%3D%223.5%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23101a13%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M12%2034h40%22%2F%3E%3Cpath%20d%3D%22M18%2042.5h28%22%2F%3E%3Cpath%20d%3D%22M25%2051h14%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#fbfbf6; --card:#ffffff; --ink:#101a13; --mut:#434d46; --rule:#e2e5da; --soft:#f3f4ec; --focus:#0b5fff;
    --hero:#e3f3d4; --lime:#b7f07c; --mint:#93efd9; --lilac:#dcaaf6; --bad:#a3322d;
    --ok:#17603f; --ok-bg:#dff3e3;
    /* One sequential severity scale, ordered by lightness so it still reads in greyscale. */
    --t0:#e9efe4; --t1:#f6e9b3; --t2:#f4c487; --t3:#ea9169; --t4:#b8443f; --t4-ink:#fff;
    --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:var(--sans);
    --head:"Outfit", "DM Sans", system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body { margin:0; background:var(--paper); color:var(--ink); font:17px/1.6 var(--sans); font-variant-numeric:tabular-nums; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  button, input { font:inherit; color:inherit; }
  a { color:inherit; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 20px; }
  h1, h2, h3 { font-family:var(--head); font-weight:500; letter-spacing:-.02em; line-height:1.12; margin:0; }
  h2.big { font-size:clamp(1.7rem, 3.4vw, 2.5rem); }
  .center { text-align:center; }
  .lede { color:var(--mut); margin:10px auto 0; max-width:56ch; }
  .band { padding:76px 0; }
  .btn { display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--ink); background:var(--ink); color:#fff; border-radius:6px; padding:11px 18px; font-weight:600; font-size:.95rem; cursor:pointer; text-decoration:none; }
  .btn.ghost { background:transparent; color:var(--ink); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }

  /* Nav */
  .top { background:var(--hero); padding-top:14px; }
  nav { background:#fff; border-radius:10px; padding:10px 14px; display:flex; align-items:center; gap:18px; }
  .logo { font-family:var(--head); display:flex; align-items:center; gap:9px; font-weight:500; font-size:1.3rem; letter-spacing:-.02em; text-decoration:none; }
  .logo svg { width:30px; height:30px; display:block; }
  .links { display:flex; gap:20px; margin:0 auto; font-size:.95rem; white-space:nowrap; }
  .links a { text-decoration:none; color:var(--mut); }
  .links a:hover { color:var(--ink); }
  .seg { display:inline-flex; flex:none; border:1.5px solid var(--ink); border-radius:6px; overflow:hidden; }
  .seg button { border:0; background:transparent; padding:6px 11px; font:600 .85rem var(--sans); cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:#fff; }
  nav .btn { padding:8px 14px; font-size:.86rem; }

  /* Hero */
  .hero { background:var(--hero); overflow:hidden; }
  .hero .wrap { display:grid; grid-template-columns:1.05fr .95fr; gap:24px; align-items:center; min-height:520px; padding-top:40px; padding-bottom:0; }
  .hero h1 { font-size:clamp(2.2rem, 5vw, 3.6rem); }
  .hero p { color:#2f3d33; max-width:44ch; margin:18px 0 26px; }
  .hero .cta { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .hero .cta + small { display:block; margin-top:22px; color:var(--mut); }
  .stage { position:relative; height:520px; }
  .phone { position:absolute; right:-10px; top:36px; width:320px; height:600px; background:#fff; border:9px solid var(--ink); border-radius:44px; transform:rotate(13deg); box-shadow:0 30px 60px -30px rgba(16,26,19,.45); padding:34px 14px 14px; overflow:hidden; }
  .phone::before { content:""; position:absolute; top:10px; left:50%; width:86px; height:18px; margin-left:-43px; background:var(--ink); border-radius:12px; }
  .phone .ph { font:500 1.15rem var(--head); letter-spacing:-.02em; margin-bottom:4px; }
  .phone .pl { font:600 .68rem var(--sans); color:var(--mut); margin:10px 0 5px; }
  .mini { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; }
  .mini div { border-radius:6px; padding:7px 7px 6px; font:600 1.02rem/1.2 var(--head); min-width:0; }
  .mini div small { display:block; font:600 .6rem/1.25 var(--sans); margin-top:3px; color:inherit; }
  .pc { border:1px solid var(--rule); border-left:3px solid var(--ok); border-radius:8px; padding:9px 10px; margin-top:9px; font-size:.72rem; line-height:1.4; color:var(--mut); }
  .pc b { display:block; font-size:.82rem; font-weight:600; margin-bottom:3px; color:var(--ink); }
  .pc span { display:inline-block; margin-top:6px; font:600 .6rem var(--sans); color:var(--ok); background:var(--ok-bg); border-radius:99px; padding:2px 6px; }
  .sticker { z-index:2; position:absolute; left:6%; top:120px; width:170px; height:170px; background:var(--lime); border-radius:6px; transform:rotate(-7deg); padding:16px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 18px 30px -18px rgba(16,26,19,.5); }
  .sticker b { font:500 1.35rem/1.1 var(--head); letter-spacing:-.01em; }
  .ex { position:absolute; right:14px; bottom:8px; font:500 .66rem var(--sans); color:var(--mut); }

  /* Meet */
  .two { display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center; }
  .art { background:var(--soft); border-radius:14px; padding:28px; min-height:360px; display:grid; align-content:center; gap:14px; }
  .art .row { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .art .c { border-radius:8px; padding:12px; font:600 1.35rem var(--head); background:var(--t0); opacity:.38; }
  .art .c.on { opacity:1; box-shadow:0 0 0 2px var(--ink); }
  .art .c small { display:block; font:500 .78rem var(--sans); margin-top:4px; }
  .art .card { background:#fff; border:1.5px solid var(--ink); border-left:5px solid var(--ok); border-radius:10px; padding:14px 16px; }
  .art .card b { display:block; font-weight:600; }
  .art .card p { margin:4px 0 0; color:var(--mut); font-size:.98rem; }
  .art .card p em { font:600 .95em var(--sans); font-style:normal; color:var(--ink); background:var(--soft); border:1px solid var(--rule); border-radius:4px; padding:0 4px; }
  .art .wire { height:22px; border-left:2px dashed var(--ink); margin-left:40px; }
  .pillico { width:44px; height:28px; border-radius:99px; background:var(--lime); display:grid; place-items:center; margin-bottom:12px; }
  .acc { margin-top:20px; }
  .acc summary { list-style:none; cursor:pointer; padding:9px 0; display:flex; align-items:center; gap:12px; font-weight:500; }
  .acc summary::-webkit-details-marker { display:none; }
  .acc summary::before { content:"+"; font:400 1.05rem/1 var(--sans); width:22px; height:22px; flex:none; display:grid; place-items:center; border:1px solid var(--rule); border-radius:4px; background:#fff; }
  .acc details[open] summary::before { content:"−"; }
  .acc p { margin:0 0 12px 34px; color:var(--mut); font-size:1rem; }

  /* Hazard cards */
  .cards { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-top:34px; }
  .hz .pic { border-radius:4px; aspect-ratio:1 / 1; display:grid; place-items:center; position:relative; overflow:hidden; }
  .hz .pic svg { width:42%; height:42%; }
  .hz .pic span { position:absolute; left:14px; bottom:12px; font:500 .88rem var(--sans); }
  .hz h3 { font-size:1.45rem; margin:16px 0 8px; }
  .hz p { margin:0; font-size:.98rem; color:var(--mut); }
  .hz.a .pic { background:#f8dcb4; } .hz.b .pic { background:#cfe6f5; } .hz.c .pic { background:var(--lilac); } .hz.d .pic { background:#fbf0a8; }

  /* Tool */
  #tool { background:var(--soft); }
  .panel { background:#fff; border-radius:16px; padding:26px; margin-top:30px; box-shadow:0 1px 0 var(--rule); }
  .setup { display:grid; gap:16px; }
  .label { font:600 .95rem var(--sans); color:var(--ink); color:var(--mut); display:block; margin-bottom:7px; }
  #q { width:100%; padding:13px 15px; border:1.5px solid var(--rule); border-radius:8px; background:var(--soft); font-size:1.02rem; }
  #q:focus { border-color:var(--ink); background:#fff; outline:none; }
  #sugg { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:9px; }
  .pill { border:1px solid var(--rule); background:#fff; border-radius:999px; padding:7px 14px; cursor:pointer; font-size:.95rem; }
  .pill:hover { border-color:var(--ink); }
  #picked { margin:9px 0 0; font:500 .95rem var(--sans); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips label { display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border:1px solid var(--rule); border-radius:999px; background:#fff; cursor:pointer; font-size:.95rem; }
  .chips label:has(input:checked) { border-color:var(--ink); background:var(--lime); font-weight:600; }
  .chips input { position:absolute; opacity:0; width:1px; height:1px; }
  .chips label:has(input:focus-visible) { outline:2px solid var(--focus); outline-offset:2px; }
  .msg { margin:0; color:var(--mut); }
  .err { color:var(--bad); font-weight:500; }
  #out section { padding:26px 0 0; }
  #out h2 { font:600 1rem var(--sans); color:var(--ink); color:var(--mut); margin:0 0 12px; }

  .strip { display:grid; grid-template-columns:minmax(52px, 92px) repeat(3, minmax(0, 1fr)); gap:6px; }
  .strip .dh { font-weight:600; font-size:1rem; padding:0 2px 4px; }
  .strip .dh small { display:block; font:400 .82rem var(--sans); color:var(--mut); }
  .strip .rh { font:600 .88rem var(--sans); color:var(--ink); color:var(--mut); align-self:center; }
  .cell { position:relative; border:1px solid transparent; border-radius:8px; padding:9px 9px 8px; cursor:pointer; min-height:92px; display:flex; flex-direction:column; justify-content:space-between; background:var(--t0); transition:opacity .15s, box-shadow .15s; }
  .cell.t1 { background:var(--t1); } .cell.t2 { background:var(--t2); } .cell.t3 { background:var(--t3); } .cell.t4 { background:var(--t4); color:var(--t4-ink); }
  .cell.na { background:transparent; border:1px dashed var(--rule); cursor:default; color:var(--mut); font-size:.8rem; }
  .cell.ctx { background:#fff; border:1px solid var(--rule); cursor:default; }
  .num { font:600 1.65rem/1.1 var(--head); letter-spacing:-.01em; }
  .num small { font:500 .8rem var(--sans); margin-left:2px; opacity:.85; }
  .lvl { font-size:.84rem; line-height:1.25; font-weight:600; margin-top:6px; }
  .sub2 { font:400 .8rem var(--sans); opacity:.9; }
  .cell .cmp { position:absolute; top:7px; right:8px; font:600 .7rem var(--sans); border:1px solid currentColor; border-radius:4px; padding:0 3px; }
  .bar { position:relative; height:6px; background:var(--rule); border-radius:3px; margin-top:6px; }
  .bar i { position:absolute; top:-3px; left:50%; width:1px; height:12px; background:var(--mut); }
  .bar b { position:absolute; top:-2px; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:var(--ink); }
  .dim .cell:not(.lit):not(.ctx):not(.na), .dim .item:not(.lit) { opacity:.3; }
  .cell.lit { box-shadow:0 0 0 2px var(--ink); }
  .note { margin:12px 0 0; font-size:.9rem; color:var(--mut); }

  .items { display:grid; gap:10px; }
  .item { background:#fff; border:1.5px solid var(--rule); border-left:5px solid var(--ok); border-radius:10px; padding:15px 17px; cursor:pointer; transition:opacity .15s; }
  .item.notice, .item.compound { border-left-color:#9aa39c; background:var(--soft); }
  .item.lit { border-color:var(--ink); border-left-color:var(--ok); }
  .item.notice.lit, .item.compound.lit { border-left-color:#9aa39c; }
  .item h3 { font-size:1.28rem; font-weight:500; letter-spacing:-.01em; line-height:1.3; margin:0 0 6px; }
  .item.notice h3, .item.compound h3 { font-size:1rem; font-weight:500; }
  .item p { margin:0; color:var(--mut); font-size:1rem; }
  .item p b { font:600 .95em var(--sans); color:var(--ink); background:var(--soft); border:1px solid var(--rule); border-radius:4px; padding:0 4px; white-space:nowrap; }
  .badge { display:inline-block; margin-top:10px; font:600 .8rem var(--sans); padding:3px 9px; border-radius:999px; border:1px solid var(--rule); color:var(--mut); background:#fff; }
  .badge.ok { background:var(--ok-bg); border-color:transparent; color:var(--ok); }
  .quiet { background:var(--hero); border-radius:10px; padding:20px; font:500 1.25rem/1.35 var(--head); }
  #out details { background:#fff; border:1.5px solid var(--rule); border-radius:10px; }
  #out summary { padding:13px 16px; cursor:pointer; font-weight:600; color:var(--ok); }
  .audit { padding:0 16px 16px; display:grid; gap:14px; font-size:.95rem; }
  .audit h4 { margin:0 0 4px; font:600 .95rem var(--sans); color:var(--ink); color:var(--mut); }
  .audit ul { margin:0; padding-left:18px; } .audit li { margin:2px 0; }
  .rej { font-size:.92rem; }
  .skel { border-radius:8px; background:linear-gradient(90deg, var(--rule), #fff, var(--rule)); background-size:200% 100%; animation:sh 1.2s linear infinite; min-height:78px; }
  @keyframes sh { to { background-position:-200% 0; } }

  /* Process */
  .steps { list-style:none; margin:22px 0 0; padding:0; counter-reset:s; display:grid; gap:10px; }
  .steps li { counter-increment:s; display:grid; grid-template-columns:26px 1fr; gap:12px; align-items:start; }
  .steps li::before { content:counter(s); font:600 .9rem/24px var(--sans); width:24px; height:24px; text-align:center; border:1px solid var(--rule); border-radius:4px; background:#fff; }
  .pipe { background:var(--soft); border-radius:14px; padding:26px; display:grid; gap:10px; }
  .pipe div { background:#fff; border-radius:10px; padding:13px 15px; display:flex; justify-content:space-between; align-items:center; gap:12px; font-weight:500; }
  .pipe div.ai { background:var(--lilac); } .pipe div.v { background:var(--lime); } .pipe div.ai span, .pipe div.v span { color:#1c2a20; }
  .pipe span { font:500 .85rem var(--sans); color:var(--mut); white-space:nowrap; }
  .pipe i { justify-self:center; font-style:normal; color:var(--mut); line-height:.6; }

  /* Evidence */
  .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-top:34px; }
  .stat { border-radius:6px; padding:24px; text-align:center; }
  .stat.a { background:var(--mint); } .stat.b { background:var(--lime); } .stat.c { background:var(--lilac); }
  .stat h3 { font-size:1.15rem; }
  .stat .n { font:500 3.4rem/1 var(--head); letter-spacing:-.04em; margin:22px 0 8px; }
  .stat p { margin:0; font-size:.95rem; color:#223027; }
  .fine { font-size:.88rem; color:var(--mut); margin:18px auto 0; max-width:80ch; }

  footer { border-top:1px solid var(--rule); padding:26px 0 50px; color:var(--mut); font-size:.92rem; }
  footer .wrap { display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; }

  /* Loading scene: the logo's sun rises while the four steps light up in turn. */
  .loader { display:grid; justify-items:center; gap:6px; padding:30px 0 14px; }
  .loader svg { width:260px; height:auto; overflow:hidden; }
  .loader .sun { animation:rise 3.2s ease-in-out infinite alternate; transform-origin:100px 96px; }
  .loader .rays { animation:spin 14s linear infinite; transform-origin:100px 96px; }
  .loader .cloud { animation:drift 7s ease-in-out infinite alternate; }
  .loader .cloud.b { animation-duration:9s; animation-direction:alternate-reverse; }
  .loader .ln { stroke-dasharray:160; animation:draw 2.4s ease-in-out infinite alternate; }
  .loader .ln.l2 { animation-delay:.25s; } .loader .ln.l3 { animation-delay:.5s; }
  .loader .drop { animation:fall 1.6s linear infinite; opacity:0; }
  .loader .drop.d2 { animation-delay:.5s; } .loader .drop.d3 { animation-delay:1s; }
  .lnote { margin:8px 0 0; font-size:.88rem; color:var(--mut); }
  @keyframes rise { from { transform:translateY(26px); } to { transform:translateY(0); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes drift { from { transform:translateX(-10px); } to { transform:translateX(14px); } }
  @keyframes draw { from { stroke-dashoffset:160; } to { stroke-dashoffset:0; } }
  @keyframes fall { 0% { transform:translateY(-6px); opacity:0; } 20% { opacity:.9; } 100% { transform:translateY(26px); opacity:0; } }

  /* Match cut: shared names pair an element of the loading scene with one of the results. */
  .loader svg, .sunmark { view-transition-name:prk-sun; }
  .psteps, #out .pline { view-transition-name:prk-grid; }
  ::view-transition-group(prk-sun), ::view-transition-group(prk-grid), ::view-transition-group(prk-body) { animation-duration:.65s; animation-timing-function:cubic-bezier(.2,.8,.2,1); }
  ::view-transition-old(prk-grid), ::view-transition-new(prk-grid), ::view-transition-old(prk-body), ::view-transition-new(prk-body) { height:100%; object-fit:fill; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration:.35s; }
  #out h2 { display:flex; align-items:center; gap:10px; }
  .sunmark { width:30px; height:30px; flex:none; }

  /* Results arrive one after another. "backwards" so the audit-link dimming still works afterwards. */
  #out .cell, #out .item, #out .quiet { animation:pop .45s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes pop { from { opacity:0; transform:translateY(10px) scale(.98); } }

  /* The process: real steps, live while waiting, kept as one line above the result */
  .psteps { list-style:none; margin:10px 0 0; padding:0; display:grid; gap:6px; width:min(100%, 520px); }
  .psteps li { display:grid; grid-template-columns:18px auto 1fr; align-items:center; gap:10px; padding:8px 14px; border-radius:10px; background:var(--soft); color:var(--mut); font-size:.95rem; }
  .psteps li b { font-weight:500; }
  .psteps .sdet { text-align:right; font-size:.88rem; }
  .psteps .dot { width:10px; height:10px; border-radius:50%; background:currentColor; opacity:.35; justify-self:center; }
  .psteps li.run { background:var(--lime); color:var(--ink); }
  .psteps li.run .dot { opacity:1; animation:pulse 1s ease-in-out infinite; }
  .psteps li.done { color:var(--ink); background:#fff; box-shadow:inset 0 0 0 1.5px var(--rule); }
  .psteps li.done .dot { opacity:1; background:var(--ok); }
  .psteps li.fail { color:var(--bad); background:#fff; box-shadow:inset 0 0 0 1.5px var(--rule); }
  .psteps li.fail .dot { opacity:1; }
  @keyframes pulse { 50% { transform:scale(1.6); opacity:.5; } }
  .pline { display:flex; flex-wrap:wrap; gap:6px; }
  .seg { display:flex; flex-direction:column; align-items:flex-start; gap:1px; border:1.5px solid var(--rule); background:#fff; border-radius:10px; padding:8px 12px; cursor:pointer; text-align:left; flex:1 1 130px; position:relative; }
  .seg:hover { border-color:var(--ink); }
  .seg b { font-weight:600; font-size:.92rem; display:flex; align-items:center; gap:7px; }
  .seg b::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--ok); }
  .seg span { font-size:.84rem; color:var(--mut); }
  .seg.fail b::before { background:var(--bad); } .seg.fail span { color:var(--bad); }
  .seg.skip b::before { background:var(--rule); } .seg.skip { background:var(--soft); }
  .audit [data-au] { border-radius:8px; padding:6px 8px; margin:-6px -8px; transition:background .3s; }
  .audit .hot { background:var(--hero); }

  /* Status line used by every control */
  .act { display:block; min-height:1.3em; margin-top:8px; font-size:.92rem; color:var(--mut); }
  .act:empty { display:none; }
  .act.run::before { content:""; display:inline-block; width:8px; height:8px; margin-right:8px; border-radius:50%; background:var(--ink); animation:pulse 1s ease-in-out infinite; }
  .act.ok { color:var(--ok); } .act.bad { color:var(--bad); }
  .where { display:flex; gap:8px; } .where #q { flex:1; }
  .where .btn { white-space:nowrap; }

  if (text != null) e.textContent = text;
  return e;
}
const placeName = (p) => (p.mine ? t().myPlace : [p.name, p.admin, p.country].filter(Boolean).join(', '));
const chosen = () => [...document.querySelectorAll('#profile input:checked')].map((i) => i.value);

// One status line per control: what is happening now, or what just happened. Never on a timer.
function act(id, kind, text) {
  const n = $(id);
  n.className = 'act' + (kind ? ' ' + kind : '');
  n.textContent = text || '';
}

// Choices are kept in this browser only (localStorage), never on the server.
function remember() {
  try { localStorage.setItem(STORE, JSON.stringify({ lang: state.lang, place: state.place, profile: chosen() })); } catch { /* storage blocked: nothing to do */ }
}
function recall() {
  try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; }
}

function renderStatic() {
  document.documentElement.lang = state.lang;
  for (const n of document.querySelectorAll('[data-t]')) n.textContent = t()[n.dataset.t];
  for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
  $('q').placeholder = t().placeholder;
  const checked = new Set(document.querySelector('#profile input') ? chosen() : state.profile);
  $('profile').textContent = '';
  for (const [k, v] of Object.entries(t().profiles)) {
    const l = el('label');
    const i = el('input'); i.type = 'checkbox'; i.value = k; i.checked = checked.has(k);
    i.addEventListener('change', remember);
    l.append(i, document.createTextNode(v));
    $('profile').appendChild(l);
  }
  if (state.place) $('picked').textContent = `${t().selected} ${placeName(state.place)}`;
  if (!$('sugg').dataset.live) showExamples();
}

function pick(p) {
  state.place = p;
  $('picked').textContent = `${t().selected} ${placeName(p)}`;
  $('go').disabled = false;
  showExamples();
  remember();
}
function showExamples() {
  const s = $('sugg'); s.textContent = ''; delete s.dataset.live;
  if (state.place) return;
  s.appendChild(el('span', 'msg', t().examples));
  for (const p of EXAMPLES) { const b = el('button', 'pill', p.name); b.type = 'button'; b.onclick = () => { $('q').value = p.name; pick(p); }; s.appendChild(b); }
}

let timer;
$('q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const q = $('q').value.trim();
    const s = $('sugg');
    if (q.length < 2) { act('searchAct', '', ''); showExamples(); return; }
    act('searchAct', 'run', t().searchRun);
    try {
      const r = await (await fetch('/api/geocode?q=' + encodeURIComponent(q))).json();
      s.textContent = ''; s.dataset.live = '1';
      if (!Array.isArray(r) || !r.length) { act('searchAct', '', t().none); return; }
      act('searchAct', 'ok', t().found(r.length));
      for (const p of r) { const b = el('button', 'pill', placeName(p)); b.type = 'button'; b.onclick = () => { $('q').value = p.name; act('searchAct', '', ''); pick(p); }; s.appendChild(b); }
    } catch { s.textContent = ''; act('searchAct', 'bad', t().searching); }
  }, 300);
});

$('locate').onclick = () => {
  if (!navigator.geolocation) { act('searchAct', 'bad', t().locUnsupported); return; }
  act('searchAct', 'run', t().locAsk);
  navigator.geolocation.getCurrentPosition((pos) => {
    // Two decimals is about 1 km: enough for a forecast grid cell, and less precise than the device reports.
    const round = (x) => Math.round(x * 100) / 100;
    $('q').value = '';
    pick({ mine: true, name: '', admin: '', country: '', lat: round(pos.coords.latitude), lon: round(pos.coords.longitude) });
    act('searchAct', 'ok', t().locOk);
  }, (err) => {
    act('searchAct', 'bad', err.code === 1 ? t().locDenied : err.code === 3 ? t().locTimeout : t().locNone);
  }, { timeout: 10000, maximumAge: 600000 });
};

$('forget').onclick = () => {
  try { localStorage.removeItem(STORE); } catch { /* storage blocked */ }
  state.place = null; state.profile = [];
  for (const i of document.querySelectorAll('#profile input')) i.checked = false;
  $('picked').textContent = ''; $('q').value = ''; $('go').disabled = true;
  showExamples();
  act('searchAct', 'ok', t().forgotten);
};

function tone(f) { return TONES[f.hazard][f.severity] ?? 0; }

// Highlight the cells and briefing items that share any of the given fact ids.
function light(ids) {
  const out = $('out');
  const set = new Set(ids);
  const hit = (n) => (n.dataset.ids || '').split(' ').some((x) => set.has(x));
  out.classList.toggle('dim', set.size > 0);
  for (const n of out.querySelectorAll('[data-ids]')) n.classList.toggle('lit', set.size > 0 && hit(n));
}
function linkable(node, ids) {
  node.dataset.ids = ids.join(' ');
  node.tabIndex = 0;
  const on = () => light(ids);
  node.addEventListener('mouseenter', on);
  node.addEventListener('focus', on);
  node.addEventListener('mouseleave', () => light([]));
  node.addEventListener('blur', () => light([]));
  node.addEventListener('click', (e) => { e.stopPropagation(); on(); });
}

function strip(d) {
  const L = t();
  const byId = Object.fromEntries(d.facts.map((f) => [f.id, f]));
  const dates = [...new Set(d.facts.map((f) => f.date))];
  const compound = new Set(d.compound ? d.compound.fact_ids : []);
  const g = el('div', 'strip');
  g.appendChild(el('div'));
  dates.forEach((date) => {
    const f = d.facts.find((x) => x.date === date);
    const h = el('div', 'dh', L.day[f.day]);
    h.appendChild(el('small', '', L.weekday(f.weekday)));
    g.appendChild(h);
  });
  const rows = [['heat', 'heat', []], ['rain', 'rain', ['rainprob']], ['air', 'aqi', ['pm25']], ['uv', 'uv', []]];
  for (const [row, key, extra] of rows) {
    g.appendChild(el('div', 'rh', L.rows[row]));
    dates.forEach((_, i) => {
      const f = byId[`${key}-${i}`];
      if (!f) { g.appendChild(el('div', 'cell na', L.nodata)); return; }
      const c = el('div', 'cell t' + tone(f));
      c.setAttribute('role', 'button');
      const n = el('div', 'num', fmt(f.value));
      if (row === 'heat' || row === 'rain') n.appendChild(el('small', '', row === 'heat' ? '°C' : 'mm'));
      const top = el('div'); top.appendChild(n);
      if (row === 'rain') { if (byId[`rainprob-${i}`]) top.appendChild(el('div', 'sub2', L.chance(byId[`rainprob-${i}`].value))); }
      else top.appendChild(el('div', 'sub2', L.units[row]));
      // When the peak falls, from hourly data. Set by rule; the model never writes clock times.
      if (f.peak) top.appendChild(el('div', 'sub2 pk', L.peaks(hour(f.peak))));
      c.append(top, el('div', 'lvl', L.level(f.level)));
      if (compound.has(f.id)) { const m = el('span', 'cmp', L.cmp); m.title = L.compound; c.appendChild(m); }
      c.setAttribute('aria-label', `${L.rows[row]}, ${L.day[f.day]}: ${fmt(f.value)} ${f.unit}, ${L.level(f.level)}`);
      linkable(c, [f.id, ...extra.map((e) => `${e}-${i}`)]);
      g.appendChild(c);
    });
  }
  if ((d.context || []).length) {
    g.appendChild(el('div', 'rh', L.rows.ctx));
    dates.forEach((date) => {
      const x = d.context.find((k) => k.date === date);
      if (!x) { g.appendChild(el('div', 'cell na', L.nodata)); return; }
      const c = el('div', 'cell ctx');
      const top = el('div');
      top.appendChild(el('div', 'num', L.ctx(x.anomaly)));
      top.appendChild(el('div', 'sub2', L.norm(x.normal)));
      const bar = el('div', 'bar'); bar.appendChild(el('i'));
      const dot = el('b'); dot.style.left = (50 + Math.max(-8, Math.min(8, x.anomaly)) * 6.25) + '%';
      bar.appendChild(dot);
      c.append(top, bar);
      g.appendChild(c);
    });
  }
  return g;
}

// Evidence text with each number shown as a small chip.
function evidence(text) {
  const p = el('p');
  for (const part of text.split(/(\d+(?:[.,]\d+)?)/)) p.appendChild(/^\d/.test(part) ? el('b', '', part) : document.createTextNode(part));
  return p;
}
function item(kind, headline, body, badge, ids) {
  const a = el('article', 'item' + (kind === 'model' ? '' : ' ' + kind));
  a.appendChild(el('h3', '', headline));
  a.appendChild(kind === 'model' ? evidence(body) : el('p', '', body));
  a.appendChild(el('span', 'badge' + (kind === 'model' ? ' ok' : ''), badge));
  linkable(a, ids);
  return a;
}

/* ---- The process: what the server did for this briefing, shown live and kept afterwards ---- */

// One line of detail for a finished step, built only from what the server reported.
function stepDetail(e) {
  const L = t();
  const text = e.id === 'cache' ? L.sd.cache({ at: clock(e.readAt) }) : L.sd[e.id](e);
  return e.ms >= 100 ? `${text} · ${L.secs(fmt((e.ms / 1000).toFixed(1)))}` : text;
}
function stepList() {
  const ol = el('ol', 'psteps');
  for (const id of STEP_IDS) {
    const li = el('li', 'wait'); li.dataset.step = id;
    li.append(el('span', 'dot'), el('b', '', t().steps[id]), el('span', 'sdet'));
    ol.appendChild(li);
  }
  return ol;
}
function onStep(e) {
  const out = $('out');
  if (e.id === 'cache') {
    for (const li of out.querySelectorAll('.psteps li')) li.className = 'done';
    const note = out.querySelector('.lnote'); if (note) note.textContent = `${t().steps.cache}: ${stepDetail(e)}`;
    return;
  }
  const li = out.querySelector(`.psteps li[data-step="${e.id}"]`);
  if (!li) return;
  li.className = e.state === 'start' ? 'run' : e.state;
  li.querySelector('.sdet').textContent = e.state === 'start' ? (e.attempt > 1 ? t().tryN(e.attempt) : '') : stepDetail(e);
}

// The same steps as one compact line above the result. Each segment opens its part of the audit trail.
function processLine(d) {
  const L = t();
  const last = new Map();
  for (const e of d.trace || []) last.set(e.id, e); // a retried step keeps its final outcome
  const wrap = el('div', 'pline');
  wrap.setAttribute('role', 'group'); wrap.setAttribute('aria-label', L.process);
  STEP_IDS.forEach((id) => {
    const e = last.get(id);
    const b = el('button', 'seg ' + (e ? e.state : 'skip'));
    b.type = 'button';
    b.append(el('b', '', L.short[id]), el('span', '', e ? stepDetail(e) : L.skipped));
    b.onclick = (ev) => { ev.stopPropagation(); openAudit(id); };
    wrap.appendChild(b);
  });
  return wrap;
}
function openAudit(id) {
  const det = $('out').querySelector('details');
  if (!det) return;
  det.open = true;
  const target = det.querySelector(`[data-au="${id}"]`) || det;
  for (const n of det.querySelectorAll('.hot')) n.classList.remove('hot');
  target.classList.add('hot');
  target.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}

/* ---- Share and copy ---- */

function briefingText(d) {
  const L = t();
  const dates = [...new Set(d.facts.map((f) => f.date))];
  const cap = (x) => x.charAt(0).toUpperCase() + x.slice(1);
  const lines = [`Prakira · ${placeName(state.place)}`, cap(L.readAt(clock(d.generatedAt))), ''];
  for (const date of dates) {
    const fs = d.facts.filter((f) => f.date === date && f.level !== 'n/a');
    lines.push(`${L.day[fs[0].day]} (${L.weekday(fs[0].weekday)}): ` + fs.map((f) => `${L.rows[f.hazard === 'air' ? 'air' : f.hazard]} ${fmt(f.value)}${f.unit ? ' ' + f.unit : ''} (${L.level(f.level)})`).join(', '));
  }
  lines.push('');
  if (d.quiet) lines.push(L.quiet);
  for (const c of d.claims) lines.push(`• ${c.advice}`, `  ${c.evidence}`);
  if (d.compound) lines.push(`• ${d.compound.evidence} ${d.compound.advice}`);
  for (const n of d.notices || []) lines.push(`• ${n.evidence} ${n.advice}`);
  lines.push('', L.shareFoot, location.origin);
  return lines.join('\n');
}

/* ---- Long-range outlook: loaded after the briefing, from its own endpoint ---- */

async function loadOutlook(place) {
  const L = t();
  const box = $('out').querySelector('.outlook');
  if (!box) return;
  const status = box.querySelector('.act');
  status.className = 'act run'; status.textContent = L.outRun;
  try {
    const r = await fetch(`/api/outlook?lat=${place.lat}&lon=${place.lon}`);
    const o = await r.json();
    if (!r.ok) throw new Error(o.error || 'request failed');
    if (state.place !== place || !box.isConnected) return; // the user moved on
    if (!o.available) throw new Error(o.reason);
    status.className = 'act'; status.textContent = '';
    if (o.rare) { box.appendChild(el('p', 'olead', L.outRare(o.threshold))); }
    else {
      box.appendChild(el('p', 'olead', L.outLine(o.threshold)));
      const row = el('div', 'orow');
      for (const [k, arrow] of [['past', false], ['future', true]]) {
        if (arrow) row.appendChild(el('span', 'oarrow', '→'));
        const c = el('div', 'ocol');
        c.append(el('b', '', String(o[k].median)), el('span', '', L.outPast(o.periods[k])), el('small', '', L.outRange(o[k].min, o[k].max)));
        row.appendChild(c);
      }
      box.appendChild(row);
    }
    box.appendChild(el('p', 'note', L.outNote));
  } catch (e) {
    if (box.isConnected) { status.className = 'act bad'; status.textContent = L.outFail(e.message); }
  }
}

function render(d) {
  const L = t();
  const out = $('out'); out.textContent = ''; out.className = '';
  out.onclick = () => light([]);
  for (const w of d.warnings || []) out.appendChild(el('p', 'note', w));

  const s0 = el('section', 'proc');
  const h0 = el('h2');
  const sun = document.querySelector('.logo svg').cloneNode(true); sun.setAttribute('class', 'sunmark');
  h0.append(sun, document.createTextNode(`${L.process} · ${L.readAt(clock(d.generatedAt))}`));
  s0.append(h0, processLine(d));
  out.appendChild(s0);

  const s1 = el('section'); s1.appendChild(el('h2', '', `${L.strip} · ${placeName(state.place)}`));
  s1.appendChild(strip(d));
  if ((d.context || []).length) s1.appendChild(el('p', 'note', L.ctxNote));
  out.appendChild(s1);

  const s2 = el('section'); s2.appendChild(el('h2', '', L.briefing));
  const list = el('div', 'items');
  if (d.quiet) list.appendChild(el('div', 'quiet', L.quiet));
  for (const c of d.claims) list.appendChild(item('model', c.advice, c.evidence, '✓ ' + L.verified, c.fact_ids));
  if (d.compound) list.appendChild(item('compound', d.compound.evidence, d.compound.advice, L.compoundBadge, d.compound.fact_ids));
  for (const n of d.notices || []) list.appendChild(item('notice', n.evidence, n.advice, L.notice, n.fact_ids));
  if (!d.quiet && !d.claims.length && !(d.notices || []).length) list.appendChild(el('p', 'msg err', L.failed + (d.error ? ` (${d.error})` : '')));
  s2.appendChild(list);
  if (!d.quiet) s2.appendChild(el('p', 'note', L.tapNote));
  const tools = el('div', 'tools');
  const wa = el('a', 'btn ghost', L.share);
  wa.href = 'https://wa.me/?text=' + encodeURIComponent(briefingText(d)); wa.target = '_blank'; wa.rel = 'noopener';
  const cp = el('button', 'btn ghost', L.copy); cp.type = 'button';
  const said = el('span', 'act'); said.id = 'copyAct'; said.setAttribute('role', 'status');
  cp.onclick = async (e) => {
    e.stopPropagation();
    try { await navigator.clipboard.writeText(briefingText(d)); act('copyAct', 'ok', L.copied); } catch { act('copyAct', 'bad', L.copyFail); }
  };
  tools.append(wa, cp, said);
  s2.appendChild(tools);
  out.appendChild(s2);

  const s4 = el('section', 'outlook');
  s4.append(el('h2', '', L.outlookH), el('span', 'act'));
  out.appendChild(s4);

  const s3 = el('section'); s3.appendChild(el('h2', '', L.audit));
  const det = el('details');
  det.appendChild(el('summary', '', d.quiet ? L.quietAudit : L.passed(d.claims.length, d.total)));
  const body = el('div', 'audit');
  const block = (id, title, lines, cls) => {
    const b = el('div'); b.dataset.au = id;
    b.appendChild(el('h4', '', title));
    const u = el('ul'); for (const x of lines) u.appendChild(el('li', cls, x)); b.appendChild(u);
    body.appendChild(b);
  };
  const [hRules, hModel, hNotice] = L.how(d.model, d.attempts);
  block('forecast', L.steps.forecast, [L.readAt(clock(d.generatedAt)).replace(/^./, (x) => x.toUpperCase()), L.sources[0]]);
  block('climate', L.steps.climate, [L.ctxNote]);
  block('rules', L.steps.rules, [hRules, L.sources[1], L.auHouse]);
  block('model', L.steps.model, [hModel, L.sources[2]]);
  if (!d.quiet) block('verify', L.steps.verify, d.rejected.length ? d.rejected.map((r) => `${r.reason} — “${r.claim && r.claim.advice ? r.claim.advice : ''}”`) : [L.aNone], 'rej');
  block('notices', L.steps.notices, [hNotice]);
  const off = el('div'); off.appendChild(el('h4', '', L.aOfficial));
  const p = el('p'); p.style.margin = '0'; p.appendChild(document.createTextNode(L.official + ' '));
  const [name, url] = OFFICIAL[state.place.country] || WMO;
  const a = el('a', '', name); a.href = url; a.rel = 'noopener'; p.appendChild(a);
  off.appendChild(p); body.appendChild(off);
  det.appendChild(body); s3.appendChild(det); out.appendChild(s3);
}

// The waiting view: the sun, and the real steps, each filled in when the server reports it.
function waiting() {
  const out = $('out'); out.textContent = ''; out.className = '';
  const node = $('loaderT').content.cloneNode(true);
  node.querySelector('.loader').append(stepList(), el('p', 'lnote'));
  out.appendChild(node);
}
function stagger() {
  [...$('out').querySelectorAll('.cell, .item, .quiet')].forEach((n, i) => { n.style.animationDelay = 250 + Math.min(i * 40, 900) + 'ms'; });
}

// Reads the server's event stream: one "step" event per real step, then the "result".
async function briefStream(body) {
  const r = await fetch('/api/brief', { method: 'POST', headers: { 'content-type': 'application/json', accept: 'text/event-stream' }, body: JSON.stringify(body) });
  if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || `HTTP ${r.status}`); }
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  let result = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const blk = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = (blk.match(/^event: (.*)$/m) || [])[1];
      const data = JSON.parse((blk.match(/^data: (.*)$/m) || [])[1] || 'null');
      if (ev === 'step') onStep(data);
      else if (ev === 'result') result = data;
      else if (ev === 'failed') throw new Error(data.error);
    }
  }
  if (!result) throw new Error(t().noResult);
  return result;
}

async function generate() {
  if (!state.place) return;
  const place = state.place;
  $('go').disabled = true; $('status').className = 'msg'; $('status').textContent = t().loading;
  waiting();
  try {
    const d = await briefStream({ lat: place.lat, lon: place.lon, lang: state.lang, profile: chosen() });
    state.data = d;
    const show = () => { render(d); stagger(); $('status').textContent = ''; };
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (document.startViewTransition && !calm) await document.startViewTransition(show).updateCallbackDone; else show();
    loadOutlook(place);
  } catch (e) {
    state.data = null;
    const run = $('out').querySelector('.psteps li.run'); if (run) run.className = 'fail';
    $('status').className = 'msg err'; $('status').textContent = e.message + ' ';
    const b = el('button', 'pill', t().retry); b.type = 'button'; b.onclick = generate; $('status').appendChild(b);
  }
  $('go').disabled = false;
}
$('go').onclick = generate;
for (const b of document.querySelectorAll('[data-lang]')) {
  b.onclick = () => {
    if (state.lang === b.dataset.lang) return;
    state.lang = b.dataset.lang; renderStatic(); remember();
    if (state.data) generate(); // model text must be rewritten in the new language; the steps show it happening
  };
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') light([]); });

// First paint: restore what this browser remembers. The briefing itself is not requested until asked for.
const saved = recall();
if (saved && (saved.lang === 'en' || saved.lang === 'id')) state.lang = saved.lang;
else if ((navigator.language || '').toLowerCase().startsWith('id')) state.lang = 'id';
if (saved && Array.isArray(saved.profile)) state.profile = saved.profile;
if (saved && saved.place && Number.isFinite(saved.place.lat) && Number.isFinite(saved.place.lon)) state.place = saved.place;
renderStatic();
if (state.place) { $('go').disabled = false; if (!state.place.mine) $('q').value = state.place.name || ''; }
</script>
</body>
